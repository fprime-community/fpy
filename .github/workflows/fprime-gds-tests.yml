name: fprime-fpy tests

on:
  push:
    branches: [ devel ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ devel ]
# Cancel in-progress runs if a newer run is started on a given PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !contains(github.ref, 'devel') && !contains(github.ref, 'release/')}}

jobs:
  Unit-tests:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      # The tests run sequences on the real Svc::FpySequencer and
      # Svc::WasmSequencer, through C++ harnesses built from these two
      # checkouts of fprime. The harnesses are built by the test session
      # itself; see "Running tests" in the README.
      - name: Check out the fprime submodules
        run: git submodule update --init test/fprime test/fprime-wasm
      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      # The dev environment carries both the wasm extra and the tools that
      # build the harnesses (cmake, ninja, fpp, fprime-util).
      - name: Install dependencies
        run: uv sync --frozen
      - name: Test with pytest
        run: uv run --frozen pytest
