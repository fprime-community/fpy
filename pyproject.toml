[build-system]
requires = ["setuptools", "setuptools_scm[toml]>=6.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fprime-fpy"
dynamic = ["version"]
description = "Fpy Advanced Sequencing Language for F Prime"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE.txt"}
keywords = ["fprime", "embedded", "nasa", "flight", "software"]
authors = [
  {name = "Zimri Leisher", email = "zimri.leisher@gmail.com"},
  {name = "Michael Starch", email = "Michael.D.Starch@jpl.nasa.gov"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: Unix",
    "Operating System :: POSIX",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "pytest>=6.2.4",
    "lark>=1.2.2",
]

####
# Optional dependencies:
#
# The LLVM/wasm backend is opt-in: `pip install fprime-fpy[wasm]`. Without it,
# the fpy bytecode backend still works; anything that reaches the LLVM backend
# raises a BackendError pointing at this extra.
####
[project.optional-dependencies]
wasm = [
    # Compiles the LLVM IR the backend emits.
    "llvmlite>=0.44.0",
    # Provides wasm-ld (LLVM's linker) to link the LLVM/wasm backend's object output.
    "ziglang>=0.16.0",
]

[project.urls]
Homepage = "https://fprime.jpl.nasa.gov"
Documentation = "https://nasa.github.io/fprime/"
Repository = "https://github.com/fprime-community/fpy"

####
# Entry Points:
#
# Defines the list of entry-level (scripts) that are defined by this package. This allows
# standard use of utilities that ship as part of F prime.
####
[project.scripts]
fprime-fpyc = "fpy.main:compile_main"
fprime-fpy-asm = "fpy.main:assemble_main"
fprime-fpy-disasm = "fpy.main:disassemble_main"
fprime-fpy-cmd = "fpy.main:cmd_main"
fprime-fpy-depend = "fpy.main:depend_main"

####
# The test suite lives in test/fpy. The fprime submodules and the harness
# build trees carry their own (huge) test collections, so keep pytest from
# ever recursing into them.
####
[tool.pytest.ini_options]
testpaths = ["test/fpy"]
norecursedirs = [
    "fprime",
    "fprime-wasm",
    "harness",
    "build-*",
    ".*",
    "*.egg",
    "build",
    "dist",
    "venv",
]

####
# setuptools_scm dynamically generates version number from git, as well as automatically
# include all data files tracked by git (e.g. flash/static/** files).
# See https://setuptools.pypa.io/en/latest/userguide/datafiles.html
####
[tool.setuptools_scm]

####
# The test suite covers both backends, so a development environment picks up
# the wasm extra without having to ask for it. The harness group holds the
# tools that build the C++ test harness from the fprime submodules; the pins
# match test/fprime/requirements.txt.
####
[dependency-groups]
dev = [
    "fprime-fpy[wasm]",
    "black>=26.5.1",
    "pre-commit>=4.6.0",
    {include-group = "harness"},
]
harness = [
    "cmake==3.26.0",
    "fprime-fpp==3.3.0a15",
    "fprime-tools==4.3.0a5",
    "ninja==1.11.1.4",
]


####
# Additional notes
#
# With regards to the configuration of the older versions of setup.py:
# - package_data: included by default, and setuptools_scm will automatically include all files tracked by git
# - package discovery (src/): setuptools will automatically discover all packages as we use the src-layout
#
# Reference:
# - https://setuptools.pypa.io/en/latest/userguide/pyproject_config.html
# - https://setuptools.pypa.io/en/latest/userguide/package_discovery.html#src-layout
####
