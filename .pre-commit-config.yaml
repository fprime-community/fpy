# Install into .git/hooks with: uv run pre-commit install
# Both hooks run through the project venv (uv), so uv sync is the only setup.
repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: uv run black
        language: system
        types: [python]
      - id: spec-links
        name: spec test links
        entry: uv run python verify/spec_links.py
        language: system
        pass_filenames: false
        always_run: true
